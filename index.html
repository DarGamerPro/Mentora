<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mentora: an AI personal learning assistant with a tutor, notes, spaced-repetition flashcards, quizzes, a study planner and a focus timer.">
  <meta name="color-scheme" content="light dark">
  <title>Mentora</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='9' fill='%231f1c17'/%3E%3Cpath d='M9.5 22.5V11l6.5 6.5 6.5-6.5v11.5' fill='none' stroke='%23f3eee3' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='25' cy='7' r='4' fill='%23f7e45a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    try {
      var s = (JSON.parse(localStorage.getItem("mentora.v1") || "{}").settings) || {};
      if (s.theme === "light" || s.theme === "dark") document.documentElement.dataset.theme = s.theme;
      document.documentElement.lang = s.lang === "mk" ? "mk" : "en";
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript><p class="noscript">Mentora needs JavaScript to run.</p></noscript>

  <script src="vendor/anthropic-sdk.js"></script>
  <script src="js/core.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/brain.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/tutor.js"></script>
  <script src="js/views/notes.js"></script>
  <script src="js/views/cards.js"></script>
  <script src="js/views/quiz.js"></script>
  <script src="js/views/planner.js"></script>
  <script src="js/views/focus.js"></script>
  <script src="js/views/settings.js"></script>
</body>
</html>
